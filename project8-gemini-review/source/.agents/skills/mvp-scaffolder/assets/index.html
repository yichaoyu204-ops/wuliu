<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <style>
    * { box-sizing: border-box }
    body { max-width: 38rem; margin: 8vh auto; padding: 1rem; font: 1.1rem/1.6 system-ui; color: #21342e }
    label, output { display: block }
    input, button { margin: .5rem 0; padding: .65rem; font: inherit }
    input { width: 100% }
    button { background: #214d3b; color: white; border: 0; border-radius: .25rem }
    output { overflow-wrap: anywhere }
  </style>
  <script defer src="app.js"></script>
</head>
<body>
  <main>
    <h1>{{TITLE}}</h1>
    <form id="check">
      <label for="value">输入单号</label>
      <input id="value" autocomplete="off" placeholder="例如 DEMO-42">
      <button type="submit">核对输入</button>
      <output id="result" aria-live="polite"></output>
    </form>
  </main>
</body>
</html>
